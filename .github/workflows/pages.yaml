name: Publish Pages
on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - 'schema/**'
      - 'scripts/build-pages.py'
      - '.github/workflows/pages.yaml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - name: List published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]' | jq -s '.' > .cache/pages-releases.json
      - name: Assemble site and schemas
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-pages.py --base-url "$PAGES_BASE_URL" --releases .cache/pages-releases.json
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .cache/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
