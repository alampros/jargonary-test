name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to release or retry (for example v1.2.3)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate version tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a v-prefixed semver tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    name: Run checks
    needs: version
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.version.outputs.sha }}
  publish:
    name: Publish artifacts
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out checked source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag still matches checked source
        shell: bash
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build frontend
        run: go tool task ui:build
      - name: Build and upload binaries
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Sign in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
      - name: Build and push images
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
  pages:
    name: Publish Pages
    needs: [version, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
    with:
      ref: ${{ needs.version.outputs.sha }}
