name: Publish development build
on:
  push:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: development-${{ github.repository }}
  cancel-in-progress: false
jobs:
  changes:
    name: Identify release merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-merge: ${{ steps.pr.outputs.release-merge }}
    steps:
      - name: Check merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Use PR metadata rather than depending on merge/squash commit messages.
          prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[]' | jq -s '.')"
          release_merge="$(jq --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" 'any(.[];
            .merged_at != null and .merge_commit_sha == $sha and
            .base.ref == "main" and .head.repo.full_name == $repo and
            (.head.ref | startswith("release-please--branches--")))' <<< "$prs")"
          echo "release-merge=$release_merge" >> "$GITHUB_OUTPUT"
  checks:
    name: Run checks
    needs: changes
    if: needs.changes.outputs.release-merge != 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ github.sha }}
  publish:
    name: Publish development image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out checked source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Sign in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=dev
      - name: Build and push images
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
  pages:
    name: Publish Pages
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
    with:
      ref: ${{ github.sha }}
