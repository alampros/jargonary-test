name: Check
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  pull_request:
permissions:
  contents: read
jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool task lint-go
  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: biomejs/setup-biome@v2.7.1
        with:
          working-dir: web
      - run: biome check --error-on-warnings ../biome.json .
        working-directory: web
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go tool task ui
      - run: npm --prefix web run typecheck
      - run: go tool task test
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - run: |
          go tool task schema
          git diff --exit-code -- schema/glossary.schema.json
      - run: go run ./cmd/jargonary -validate glossary/project.json
      - run: go run ./cmd/jargonary -validate examples/terms/company.yaml -format yaml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: glossary:test
      - run: |
          docker run --rm glossary:test -schema > /tmp/schema.json
          python3 -c 'import json; json.load(open("/tmp/schema.json"))'
          docker run -d --name glossary -p 127.0.0.1:8080:8080 glossary:test
          trap 'docker logs glossary; docker rm -f glossary' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/.well-known/glossary > /tmp/glossary.json
          python3 -c 'import json; d=json.load(open("/tmp/glossary.json")); assert d["entries"]'
          curl -fsS http://127.0.0.1:8080/ > /tmp/home.html
          grep -q 'Company glossary' /tmp/home.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/config)" = 404
