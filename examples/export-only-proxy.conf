# Nginx location rules for an existing HTTPS server block. Keep the private
# instance off the public network; proxy only the intended export route.
# The scraping instance uses HTTPS to reach this proxy and supplies its bearer
# credential, which the private application validates on every request.
location = /.well-known/glossary/public {
    proxy_pass http://private-glossary:8080;
    proxy_set_header Authorization $http_authorization;
}
location / {
    return 404;
}
