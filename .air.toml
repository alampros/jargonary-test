root = "."
tmp_dir = ".cache/air"
env_files = []

[build]
cmd = "go build -o ./bin/jargonary ./cmd/jargonary"
entrypoint = ["./bin/jargonary"]
args_bin = ["-config", "examples/config.yaml", "-dev-ui"]
include_ext = ["go", "mod", "sum", "json", "yaml", "yml", "csv", "toml"]
exclude_dir = [
  ".git",
  ".cache",
  ".task",
  "bin",
  "data",
  "docs",
  "schema",
  "ui",
  "internal/webui/dist",
  "docs-site",
]
exclude_regex = ["_test\\.go$", "\\.test\\.tsx?$", "ui/src/test/"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "12s"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
